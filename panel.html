    nav.lado { position: static; height: auto; flex: none; width: 100%; border-right: 0; border-bottom: 1px solid var(--linea); padding: 12px 16px; }
    .pagina { padding: 18px 16px 60px; }
    .dos { grid-template-columns: 1fr; }
    .ep-equipos { max-width: none; flex-direction: row; overflow-x: auto; } .ep-eq { min-width: 200px; } .ep-cajon { max-width: none; position: static; }
    .barra-h { grid-template-columns: 110px 1fr 36px; }
  }
</style>
</head>
<body>
<div id="toasts" role="status" aria-live="polite"></div>
<div id="app"><div class="cargando">Cargando Hodor Supervisor…</div></div>
<script>
const CLAVE = "__CLAVE__", VERSION = "__VERSION__";
const RAMAS = [["development", "development"], ["master", "master"], ["release", "release"]];
const ROLES = [["lider", "Aprobador Pro", "Hodor Supervisor Pro"], ["aprobador", "Aprobador", "Hodor Supervisor"], ["desarrollador", "Desarrollador", "Hodor Worker (sin supervisor)"]];
const TEMAS = [["oscuro", "Oscuro"], ["claro", "Claro"]];
const S = { yo: null, estado: null, tab: "", tema: "oscuro", equipo: "", dias: 30, diasApr: 30, sub: "por", prodVista: "listos", sel: "", abiertos: new Set(["release"]),
  datos: {}, cargado: {}, fallos: {}, aprobando: {}, ed: null, tokenNuevo: null, editRegla: null, nuevaExc: null, nuevoEquipo: false, ficha: null, fichaDe: "",
  busca: "", filtroRol: "", eqSel: "", agregandoAprueba: false, programar: false, staging: false, error: "", metTab: "resumen", orden: {} };

const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const ahora = () => Date.now() / 1000;
function hace(ts) { const d = dura(ts); return d ? `hace ${d}` : ""; }
function dura(ts) { ts = Number(ts || 0); if (!ts) return ""; const s = ahora() - ts; if (s < 3600) return `${Math.max(1, Math.round(s / 60))} min`; if (s < 86400) return `${Math.round(s / 3600)} h`; return `${Math.round(s / 86400)} d`; }
function fecha(ts) { ts = Number(ts || 0); return ts ? new Date(ts * 1000).toLocaleString("es-CO", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }) : ""; }
function diaInput(ts) { ts = Number(ts || 0); if (!ts) return ""; const d = new Date(ts * 1000); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; }
function desdeInput(v, fin) { if (!v) return 0; const [y, m, d] = v.split("-").map(Number); return new Date(y, m - 1, d, fin ? 23 : 0, fin ? 59 : 0, 0).getTime() / 1000; }
const ini = (n) => String(n || "").split(/[\s@._-]+/).filter(Boolean).slice(0, 2).map((p) => p[0].toUpperCase()).join("");
const nombre = (c) => String(c || "").split("@")[0].split(/[._]/).map((p) => p.charAt(0).toUpperCase() + p.slice(1)).join(" ");
const pro = () => !!S.yo && S.yo.edicion === "pro";
const jira = (hu) => hu ? `https://global66.atlassian.net/browse/${encodeURIComponent(hu)}` : "";

const ic = (d, extra) => `<svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"${extra || ""}>${d}</svg>`;
const CHEVRON = ic(`<path d="m6 9 6 6 6-6"></path>`);
const I_EXTERNO = ic(`<path d="M7 17 17 7M8 7h9v9"></path>`, ` width="12" height="12"`);
const I_INICIO = ic(`<path d="M3 11 12 4l9 7"></path><path d="M5 10v10h14V10"></path>`);
const I_EQUIPOS = ic(`<circle cx="9" cy="8" r="3"></circle><path d="M3 20a6 6 0 0 1 12 0"></path><circle cx="17" cy="9" r="2.5"></circle><path d="M15.5 14.2A5 5 0 0 1 21 19"></path>`);
const I_METRICAS = ic(`<path d="M4 20V10"></path><path d="M10 20V4"></path><path d="M16 20v-7"></path><path d="M22 20H2"></path>`);
const I_PRS = ic(`<circle cx="6" cy="6" r="2.2"></circle><circle cx="6" cy="18" r="2.2"></circle><circle cx="18" cy="18" r="2.2"></circle><path d="M6 8.2v7.6"></path><path d="M18 15.8V11a3 3 0 0 0-3-3h-4"></path><path d="m13 6-2 2 2 2"></path>`);
const I_REGLAS = ic(`<path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"></path><path d="M5 17a3 3 0 0 1 3-3h11"></path><path d="M9 8h6"></path>`);
const I_APROBAR = ic(`<path d="M9 12l2 2 4-4"></path><path d="M12 3l7 3v6c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6z"></path>`);
const I_HISTORIAL = ic(`<path d="M3 12a9 9 0 1 0 3-6.7L3 8"></path><path d="M3 3v5h5"></path><path d="M12 7v5l3 2"></path>`);
const I_AJUSTES = ic(`<circle cx="12" cy="12" r="3"></circle><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"></path>`);
const I_ACTUALIZAR = ic(`<path d="M12 3v12"></path><path d="m7 10 5 5 5-5"></path><path d="M5 21h14"></path>`);
const I_TEMA = ic(`<circle cx="12" cy="12" r="9"></circle><path d="M12 3a9 9 0 0 0 0 18z" fill="currentColor"></path>`);
const I_RECARGAR = ic(`<path d="M3 12a9 9 0 0 1 15.4-6.4L21 8"></path><path d="M21 3v5h-5"></path><path d="M21 12a9 9 0 0 1-15.4 6.4L3 16"></path><path d="M3 21v-5h5"></path>`);
const externo = (url, texto, cls) => url ? `<a ${cls ? `class="${cls}"` : ""} href="${esc(url)}" target="_blank" rel="noopener">${texto} ${I_EXTERNO}<span class="sr"> (abre en otra pestaña)</span></a>` : texto;

const TOAST = { ok: ["✓", "Listo"], bad: ["!", "No se pudo"], warn: ["!", "Atención"], info: ["i", "Aviso"], trabajando: ["", "Un momento"] };
function cerrarToast(el) { if (!el || el.classList.contains("sale")) return; clearTimeout(el._t); el.classList.add("sale"); setTimeout(() => el.remove(), 230); }
function aviso(t, tipo) {
  const caja = document.getElementById("toasts");
  tipo = tipo || (/…$/.test(t) ? "trabajando" : "ok");
  caja.querySelectorAll(".toast.t-trabajando").forEach(cerrarToast);
  const [icono, titulo] = TOAST[tipo] || TOAST.info;
  const el = document.createElement("div");
  el.className = `toast t-${tipo}`;
  if (tipo === "bad") el.setAttribute("role", "alert");
  el.innerHTML = `<span class="t-ico" aria-hidden="true">${tipo === "trabajando" ? `<span class="t-giro"></span>` : icono}</span><span class="t-txt"><span class="t-tit">${titulo}</span><span class="t-msg"></span></span><button type="button" class="t-cerrar" aria-label="Cerrar aviso">×</button>`;
  el.querySelector(".t-msg").textContent = String(t || "");
  el.querySelector(".t-cerrar").addEventListener("click", () => cerrarToast(el));
  caja.prepend(el);
  [...caja.querySelectorAll(".toast:not(.sale)")].slice(3).forEach(cerrarToast);
  el._t = setTimeout(() => cerrarToast(el), tipo === "trabajando" ? 60000 : tipo === "bad" ? 9000 : 4500);
}

async function api(ruta, cuerpo) {
  let r;
  try {
    r = await fetch(ruta, { method: cuerpo ? "POST" : "GET", headers: { "X-Panel": CLAVE, "Content-Type": "application/json" }, body: cuerpo ? JSON.stringify(cuerpo) : undefined });
  } catch { return { error: "No pude hablar con el servidor local de Hodor Supervisor.", status: 0 }; }
  let datos = {};
  try { datos = await r.json(); } catch { datos = { error: `respuesta inválida (${r.status})` }; }
  if (r.status === 403 && datos.error === "solo desde el panel") {
    let ultima = 0;
    try { ultima = Number(sessionStorage.getItem("recarga-clave") || 0); } catch { /* sin storage */ }
    if (Date.now() - ultima > 10000) { try { sessionStorage.setItem("recarga-clave", String(Date.now())); } catch { /* sin storage */ } location.reload(); return new Promise(() => {}); }
  }
  if (!r.ok && !datos.error) datos.error = `error ${r.status}`;
  if (!r.ok) datos.status = r.status;
  return datos;
}

function leerTema() {
  try { const t = localStorage.getItem("hodor-tema"); if (t === "claro" || t === "oscuro") return t; } catch { /* sin almacenamiento */ }
  try { return matchMedia("(prefers-color-scheme: light)").matches ? "claro" : "oscuro"; } catch { return "oscuro"; }
}
function aplicarTema(t) { S.tema = t; document.documentElement.setAttribute("data-theme", t); try { localStorage.setItem("hodor-tema", t); } catch { /* sin almacenamiento */ } }

const MENU_SUP = [["por-aprobar", "Por aprobar", I_APROBAR], ["historial", "Historial", I_HISTORIAL]];
const MENU_PRO = [["inicio", "Inicio", I_INICIO], ["equipos", "Equipos y personas", I_EQUIPOS], ["metricas", "Métricas", I_METRICAS],
  ["prs-a-prod", "PRs a Prod", I_PRS], ["reglas", "Reglas", I_REGLAS]];
const RUTAS_VIEJAS = { personas: "equipos", roles: "equipos" };
function menu() { return pro() ? MENU_PRO : MENU_SUP; }
function tabDeRuta() {
  const p = location.pathname.replace(/^\/+/, "").replace(/\/+$/, "");
  if (p === "ajustes") return "ajustes";
  const ok = menu().map((m) => m[0]);
  if (pro() && RUTAS_VIEJAS[p]) return RUTAS_VIEJAS[p];
  return ok.includes(p) ? p : ok[0];
}
function ir(tab, reemplazar) {
  S.tab = tab;
  const url = `/${tab}`;
  if (location.pathname !== url) history[reemplazar ? "replaceState" : "pushState"]({}, "", url);
  pintar();
  cargarTab();
}

function lado() {
  const yo = S.yo || {};
  const listos = ((S.datos.prod || {}).items || []).filter((x) => x.listo).length;
  const items = menu().map(([k, l, i]) => {
    const n = (k === "por-aprobar" || k === "prs-a-prod") && listos ? `<span class="n alerta">${listos}</span>` : "";
    return `<li><button class="item" data-tab="${k}" ${S.tab === k ? `aria-current="page"` : ""}>${i}<span style="flex-grow:1">${l}</span>${n}</button></li>`;
  }).join("");
  const equipos = (S.datos.equipos || {}).equipos || [];
  const selector = pro() ? "" : `<div class="equipo-sel"><span class="rot">Tu equipo</span><b style="font-weight:600">${esc(yo.equipo || "—")}</b><span class="tenue" style="font-size:12px">Asignado al darte acceso</span></div>`;
  const temaNombre = (TEMAS.find((t) => t[0] === S.tema) || TEMAS[0])[1];
  return `<nav class="lado" aria-label="Navegación">
    <div class="marca"><span class="logo" aria-hidden="true">H</span><span style="display:flex;flex-direction:column"><b style="font-weight:600">Hodor</b><span class="mono" style="font-size:11px;color:var(--tenue)">${pro() ? "Supervisor Pro" : "Supervisor"}</span></span></div>
    ${selector}
    <ul class="menu-lado">${items}</ul>
    <span style="flex-grow:1"></span>
    <div style="display:flex;flex-direction:column;gap:12px">
      <ul class="menu-lado">
        <li><button class="item" data-tab="ajustes" ${S.tab === "ajustes" ? `aria-current="page"` : ""}>${I_AJUSTES}<span style="flex-grow:1">Ajustes</span></button></li>
        <li><button class="item" data-accion="actualizar">${I_ACTUALIZAR}<span style="flex-grow:1">Buscar actualización</span></button></li>
        <li><button class="item" data-accion="tema" aria-label="Tema: ${temaNombre}. Cambiar tema">${I_TEMA}<span style="flex-grow:1">Tema</span><span class="mono" style="font-size:11px;color:var(--tenue)">${temaNombre.toLowerCase()}</span></button></li>
      </ul>
      <div class="yo"><span class="avatar" aria-hidden="true">${esc(ini(yo.nombre))}</span><span style="display:flex;flex-direction:column;min-width:0"><span style="font-weight:500;font-size:13px">${esc(yo.nombre || "")}</span><span style="font-size:11px;color:var(--tenue)">${esc(rolTexto(yo.rol))}</span><span class="mono" style="font-size:11px;color:var(--tenue)">${esc(VERSION)}</span></span></div>
    </div>
  </nav>`;
}
function rolTexto(r) { return r === "admin" ? "Aprobador" : r === "dueno" ? "Aprobador" : ((ROLES.find((x) => x[0] === r) || [])[1] || ""); }

function cabecera(rot, titulo, bajada, derecha) {
  return `<div class="titulo-pag"><div style="flex:1;min-width:260px"><div class="rot">${rot}</div><h1>${titulo}</h1>${bajada ? `<p>${bajada}</p>` : ""}</div>${derecha || ""}</div>`;
}
const recargar = (k) => `<button class="btn fant chico" data-recargar="${k}">${I_RECARGAR} Recargar</button>`;
const cargando = () => `<div class="cargando">Cargando…</div>`;
function errorDe(k) { const d = S.datos[k]; return d && d.error ? `<div class="fallo">${esc(d.error)}</div>` : ""; }

function chipPuerta(estado) { return { ok: "c-ok", na: "c-off", warn: "c-warn", bad: "c-bad", acc: "c-acc", off: "c-off" }[estado] || "c-off"; }
function chipEstado(e) { return { mergeado: "c-ok", abierto: "c-acc", cerrado: "c-off" }[e] || "c-off"; }
function puntajeIa(x) { const g = (x.puertas || []).find((p) => p.k === "ia"); return g ? g.t : ""; }

function hermanoHtml(c) {
  const nota = [c.rondas ? `${c.rondas} ${c.rondas === 1 ? "ronda" : "rondas"}` : "sin análisis", c.puntaje != null ? `IA ${c.puntaje}` : "", c.rev ? `rev ${c.rev}` : ""].filter(Boolean).join(" · ");
  return `<div class="hermano${c.actual ? " actual" : ""}"><span class="mono">${externo(c.url, `#${esc(c.pr)}`)}</span><span style="flex:1;min-width:160px">${esc(c.titulo || c.rama || "")}${c.actual ? ` <span class="chip c-acc">este</span>` : ""}</span><span class="nota">${esc(nota)}</span><span class="chip ${chipEstado(c.estado)}">${esc(c.estado)}</span></div>`;
}
function cadenaHtml(x) {
  const c = x.cadena || {};
  return `<div class="acordeon">${RAMAS.filter(([k]) => k in c).map(([k, n]) => {
    const prs = c[k] || [];
    const abierto = S.abiertos.has(`${x.pr}:${k}`) || (S.abiertos.has(k) && !S.abiertos.has(`${x.pr}:${k}:cerrado`));
    const merg = prs.filter((p) => p.mergeado).length, abiertos = prs.filter((p) => p.estado === "abierto").length;
    const resumen = prs.length ? [`${prs.length} PR${prs.length === 1 ? "" : "s"}`, merg ? `${merg} mergeado${merg === 1 ? "" : "s"}` : "", abiertos ? `${abiertos} abierto${abiertos === 1 ? "" : "s"}` : ""].filter(Boolean).join(" · ") : "sin PRs";
    return `<div><button class="rama-cab" data-rama="${esc(x.pr)}:${k}" aria-expanded="${abierto}">${CHEVRON}<span class="nom">${n}</span><span class="chip c-off mono">${prs.length}</span><span class="tenue" style="font-size:12px">${esc(resumen)}</span></button>${abierto ? `<div class="rama-cuerpo">${prs.length ? prs.map(hermanoHtml).join("") : `<span class="tenue" style="font-size:12px">La historia no tiene PRs a ${n} en este repo.</span>`}</div>` : ""}</div>`;
  }).join("")}</div>`;
}
function puertasHtml(x) {
  return `<div class="puertas">${(x.puertas || []).map((g) => `<div class="puerta"><span class="mono" style="font-size:12px">${esc(g.k)}</span><span class="chip ${chipPuerta(g.estado)}">${esc(g.t)}</span><span class="suave" style="font-size:12.5px">${esc(g.ayuda || "")}</span></div>`).join("") || `<span class="tenue">Sin puertas calculadas todavía.</span>`}</div>`;
}
function botonAprobar(x, chico) {
  const f = S.fallos[x.pr];
  const corriendo = S.aprobando[x.pr];
  return `<button class="btn prim${chico ? " chico" : ""}" data-aprobar="${esc(x.pr)}" data-repo="${esc(x.repo)}" ${corriendo || !x.listo ? "disabled" : ""}>${corriendo ? "Aprobando…" : `Aprobar #${esc(x.pr)}`}</button>${f ? externo(f.url || x.url, "Abrir en CodeCommit", "btn") : ""}`;
}
function falloHtml(x) { const f = S.fallos[x.pr]; return f ? `<div class="fallo">AWS no dejó aprobar: ${esc(f.motivo)}</div>` : ""; }

function vistaPorAprobar() {
  const yo = S.yo || {}, d = S.datos.prod;
  const primero = String(yo.nombre || "").split(" ")[0];
  const devs = (yo.devs || []).map((x) => x.nombre);
  const items = ((d || {}).items || []).filter((x) => x.listo);
  const apr = (S.datos.aprobados || {}).items || [];
  const filtroDias = (x) => !S.diasApr || (ahora() - Number(x.en || 0)) < S.diasApr * 86400;
  const aprVisibles = apr.filter(filtroDias);
  const lista = S.sub === "por"
    ? (d ? (items.length ? items.map((x) => `<article class="pr">
        <div class="pr-cab"><span class="repo">${externo(x.url, `${esc(x.repo)} #${esc(x.pr)}`)}</span>${x.hu ? externo(jira(x.hu), esc(x.hu)) : ""}<span class="chip c-ok">Listo${puntajeIa(x) ? ` · IA ${esc(puntajeIa(x))}` : ""}</span><span style="flex:1"></span><span class="tenue" style="font-size:12px">${esc([x.dev, hace(x.enviado_en || x.creado)].filter(Boolean).join(" · "))}</span></div>
        ${x.titulo ? `<div class="tit">${esc(x.titulo)}</div>` : ""}
        <div class="meta">${["development", "master"].filter((k) => k in (x.cadena || {})).map((k) => { const p = ((x.cadena || {})[k] || []).slice(-1)[0]; return `<span>${k} · ${p ? `<span class="mono">#${esc(p.pr)}</span> ${esc(p.estado)}` : "—"}</span>`; }).join("")}</div>
        ${falloHtml(x)}
        <div class="acciones">${botonAprobar(x)}<button class="btn fant" data-ver-cadena="${esc(x.pr)}" aria-expanded="${S.sel === x.pr}">${S.sel === x.pr ? "Ocultar cadena" : "Ver cadena y puertas"}</button></div>
        ${S.sel === x.pr ? `<div style="display:grid;gap:12px"><div class="rot">Cadena de la historia</div>${cadenaHtml(x)}<div class="rot">Puertas</div>${puertasHtml(x)}</div>` : ""}
      </article>`).join("") : `<div class="caja vacio">No tienes PRs a producción listos para aprobar. Cuando un PR de tus devs pase sus 5 puertas, aparece aquí.</div>`) : cargando())
    : (S.datos.aprobados ? (aprVisibles.length ? `<div class="tabla-caja"><table><thead><tr><th>PR</th><th>Historia</th><th>Dev</th><th>Aprobado</th></tr></thead><tbody>${aprVisibles.map((x) => `<tr><td class="mono">${externo(x.url, `${esc(x.repo)} #${esc(x.pr)}`)}</td><td>${x.hu ? externo(jira(x.hu), esc(x.hu)) : "—"} <span class="suave">${esc(x.titulo)}</span></td><td>${esc(x.dev)}</td><td>${esc(fecha(x.en))}</td></tr>`).join("")}</tbody></table></div>` : `<div class="caja vacio">No aprobaste PRs en este periodo.</div>`) : cargando());
  return `<div class="pagina">
    ${cabecera(`Mi equipo · ${esc(yo.equipo || "—")}`, `Hola, ${esc(primero)}. Esto está listo para que lo apruebes`,
      `Solo te llegan PRs a producción que ya pasaron todas sus puertas, de los devs que tienes asignados${devs.length ? `: ${esc(devs.join(", "))}` : ""}. Apruebas con tu usuario de AWS.`, recargar("prod"))}
    ${errorDe("prod")}
    <div class="pestanas" role="tablist"><button class="pestana" role="tab" data-sub="por" aria-selected="${S.sub === "por"}">Por aprobar <span class="chip c-off mono">${items.length}</span></button><button class="pestana" role="tab" data-sub="apr" aria-selected="${S.sub === "apr"}">Aprobados <span class="chip c-off mono">${aprVisibles.length}</span></button></div>
    ${S.sub === "apr" ? `<div class="barra" role="group" aria-label="Periodo">${[[1, "Hoy"], [7, "7 días"], [30, "30 días"]].map(([n, l]) => `<button class="filtro" data-dias-apr="${n}" aria-pressed="${S.diasApr === n}">${l}</button>`).join("")}</div>` : ""}
    <div class="lista-prs" style="gap:12px">${lista}</div>
    <p class="pie">¿Algo no cuadra? Escríbele al revisor.</p>
  </div>`;
}

function vistaHistorial() {
  const d = S.datos.aprobados;
  const items = (d || {}).items || [];
  return `<div class="pagina">${cabecera("Historial", "Lo que aprobaste", `PRs a producción que aprobaste en los últimos ${(d || {}).dias || 30} días.`, recargar("aprobados"))}
    ${errorDe("aprobados")}
    ${d ? (items.length ? `<div class="tabla-caja"><table><thead><tr><th>PR</th><th>Historia</th><th>Dev</th><th>Cuándo</th></tr></thead><tbody>${items.map((x) => `<tr><td class="mono">${externo(x.url, `${esc(x.repo)} #${esc(x.pr)}`)}</td><td>${x.hu ? externo(jira(x.hu), esc(x.hu)) : "—"} <span class="suave">${esc(x.titulo)}</span></td><td>${esc(x.dev)}</td><td>${esc(fecha(x.en))}</td></tr>`).join("")}</tbody></table></div>` : `<div class="caja vacio">Todavía no hay aprobaciones registradas.</div>`) : cargando()}
  </div>`;
}

const pct = (v) => v == null ? "—" : `${v} %`;
function vistaInicio() {
  const m = S.datos.metricas, p = S.datos.prod;
  const eqs = (m || {}).equipos || [];
  const listos = ((p || {}).items || []).filter((x) => x.listo);
